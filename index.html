<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="برنامج محادثة تفاعلي في السوبر ماركت بالعامية المصرية للبالغين ناطق بأصوات واقعية مترجم للإنجليزية مع تمارين وفاتورة تفاعلية.">
  <meta name="keywords" content="العامية المصرية, تعلم اللهجة المصرية, محادثة في السوبر ماركت, مصطلحات مصرية, Edge-TTS, لغة عربية">
  <meta name="author" content="اتكلم مصري - Speak Egyptian">
  <title>في السوبر ماركت | At the Supermarket - اتكلم مصري</title>

  <!-- Google Fonts: Cairo, Outfit, Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Confetti library for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-wrapper">
          <div class="brand-icon">🛒</div>
          <div class="brand-text">
            <h1>في السوبر ماركت <span class="dialect-badge">🇪🇬 عامية مصرية</span></h1>
            <p class="subtitle">At the Supermarket - Egyptian Arabic Conversation</p>
          </div>
        </div>

        <!-- Global Switch Controls -->
        <div class="global-toggles">
          <button id="toggle-speed" class="toggle-btn" title="تغيير سرعة الاستماع">
            <span class="icon">⚡</span>
            <span id="speed-label">السرعة: 1.0x</span>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs" role="tablist">
        <button class="nav-tab active" data-view="dialogue-view">
          <span>🎙️</span> المحادثة الكاملة
        </button>
        <button class="nav-tab" data-view="quiz-view">
          <span>🏆</span> التحدي والمسابقة
        </button>
      </nav>
    </header>

    <!-- Main Content Views -->
    <main>

      <!-- VIEW 1: DIALOGUE PLAYER -->
      <section id="dialogue-view" class="view-section active">
        <!-- Master Control Bar -->
        <div class="master-controls-card">
          <div class="playback-buttons">
            <button id="btn-play-all" class="btn-primary">
              <span id="play-all-icon">▶</span>
              <span id="play-all-text">تشغيل المحادثة كاملة</span>
            </button>
            <button id="btn-prev-line" class="btn-secondary" title="السطر السابق">
              <span>⏮</span> السابق
            </button>
            <button id="btn-next-line" class="btn-secondary" title="السطر التالي">
              التالي <span>⏭</span>
            </button>
            <button id="btn-stop" class="btn-secondary" title="إيقاف مؤقت">
              <span>⏹</span> إيقاف
            </button>
          </div>

          <div class="progress-info">
            <div class="progress-bar-bg">
              <div id="dialogue-progress-bar" class="progress-bar-fill"></div>
            </div>
            <div id="dialogue-progress-text" class="progress-text">0 / 15</div>
          </div>
        </div>

        <!-- Dialogue Feed Stream -->
        <div id="dialogue-stream" class="dialogue-stream">
          <!-- Dynamically injected dialogue bubbles -->
        </div>
      </section>

      <!-- VIEW 5: QUIZ CHALLENGE -->
      <section id="quiz-view" class="view-section">
        <div class="quiz-card">
          <div class="quiz-header">
            <div>
              <span class="dialect-badge">تحدي الفهم والاستيعاب 🧠</span>
            </div>
            <div id="quiz-progress-indicator" style="font-weight: 700; color: var(--primary-color);">
              السؤال 1 من 5
            </div>
          </div>

          <div id="quiz-question-box">
            <h3 id="quiz-question-title" class="quiz-question-text"></h3>
            <p id="quiz-question-sub" class="quiz-question-sub"></p>
            <div id="quiz-options-container" class="quiz-options-list"></div>
            <div id="quiz-feedback" class="quiz-feedback-box"></div>
          </div>

          <div id="quiz-summary-box" style="display: none; text-align: center; padding: 2rem 1rem;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
            <h3 style="font-size: 1.75rem; margin-bottom: 0.5rem;">أحسنت صنعاً! انتهى التحدي</h3>
            <p id="quiz-final-score" style="font-size: 1.25rem; font-weight: 700; color: var(--primary-color); margin-bottom: 1.5rem;"></p>
            <button id="btn-restart-quiz" class="btn-primary" style="margin: 0 auto;">إعادة الاختبار 🔄</button>
          </div>

          <div class="quiz-actions">
            <button id="btn-quiz-next" class="btn-primary" style="display: none;">
              السؤال التالي ⏭
            </button>
          </div>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>صُمم بـ ❤️ لتعليم اللهجة المصرية العامية للبالغين | ناطق بالكامل بتقنية Edge-TTS</p>
      <p style="margin-top: 0.35rem; font-size: 0.8rem; color: var(--text-muted);">جاهز ومُهيأ للنشر على منصة Cloudflare Pages</p>
    </footer>

  </div>

  <!-- Audio Player Core (Single persistent audio instance) -->
  <audio id="audio-engine" preload="auto"></audio>

  <!-- Application Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
